<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free project management app: choose Waterfall, PRINCE2, PMP, Agile or Kanban, learn reports, risk and budgeting, Earned Value calculator, toolkit and 25 interview questions.">
<meta name="keywords" content="project management, waterfall, agile, scrum, prince2, pmp, kanban, risk management, interview questions, operations management">
<meta property="og:type" content="website"><meta property="og:title" content="PM Compass: Free Project Management Learning and Decision Tool"><meta property="og:description" content="Choose, run and report projects right. Methodologies, risk, budget, toolkit and interview prep."><meta property="og:image" content="https://venkatbanday.github.io/PM-Compass/banner.jpg"><meta property="og:url" content="https://venkatbanday.github.io/PM-Compass/"><meta name="twitter:card" content="summary_large_image">
<title>PM Compass – Choose, Run and Report Projects Right</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--sf:#fff;--tx:#1b2430;--mu:#5a6676;--bd:#dde2e9;--ac:#0f7a3d;--ac2:#e6f4ec;--ok:#12805c;--wr:#b45309;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f141b;--sf:#18202a;--tx:#e8edf3;--mu:#9aa6b6;--bd:#2a3542;--ac:#2fb166;--ac2:#14301f;--ok:#3ccf9b;--wr:#f0a04b;--bad:#ff7b6e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f141b;--sf:#18202a;--tx:#e8edf3;--mu:#9aa6b6;--bd:#2a3542;--ac:#2fb166;--ac2:#14301f;--ok:#3ccf9b;--wr:#f0a04b;--bad:#ff7b6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--bd);z-index:9}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:1000px;margin:auto}
h1{font-size:18px;margin:0}h1 span{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:1000px;margin:auto}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tg{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer}
main{max-width:1000px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
h2{margin:6px 0 4px;font-size:22px}h3{margin:0 0 6px;font-size:16px}
.lead{color:var(--mu);margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin:0 4px 4px 0}
.warn{border-left:4px solid var(--wr)}.good{border-left:4px solid var(--ok)}.bad{border-left:4px solid var(--bad)}
ul{margin:4px 0 0;padding-left:20px}li{margin:2px 0}
a{color:var(--ac)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:9px 12px;border-radius:8px;margin:6px 0;cursor:pointer;font:inherit}
.opt.sel{border-color:var(--ac);background:var(--ac2)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}.row b{min-width:92px}
.gantt{position:relative;flex:1;height:22px;background:var(--bg);border-radius:6px;border:1px solid var(--bd)}
.gantt i{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--ac);opacity:.85}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--ac2)}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
.az{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.az div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}.az b{color:var(--ac)}
footer{max-width:1000px;margin:auto;padding:0 16px 30px}
input[type=range]{width:100%}
.hw{max-width:1000px;margin:auto;padding:16px 16px 0}.hero{border-radius:18px;padding:24px 22px;color:#fff;background:linear-gradient(135deg,#1f5eff,#7c3aed 60%,#db2777)}.hero h2{font-size:26px;margin:0 0 6px;color:#fff}.hero p{margin:0 0 12px;opacity:.92;max-width:640px}.chip{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 12px;margin:0 6px 6px 0;font-size:13px}
.card{transition:box-shadow .15s,transform .15s}.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.1);transform:translateY(-1px)}
.grid>.card:nth-child(6n+1){border-top:4px solid #1f5eff}.grid>.card:nth-child(6n+2){border-top:4px solid #7c3aed}.grid>.card:nth-child(6n+3){border-top:4px solid #db2777}.grid>.card:nth-child(6n+4){border-top:4px solid #ea580c}.grid>.card:nth-child(6n+5){border-top:4px solid #12805c}.grid>.card:nth-child(6n+6){border-top:4px solid #0891b2}
h2{border-left:5px solid var(--ac);padding-left:10px}.hero h2{border:0;padding:0}
nav button:hover{border-color:var(--ac)}summary{cursor:pointer;font-weight:600}details[open] summary{margin-bottom:8px}
@keyframes f{from{opacity:0;transform:translateY(6px)}}section.on{animation:f .25s}
@media (prefers-reduced-motion:reduce){section.on{animation:none}.card{transition:none}}
.ckl{display:block;margin:6px 0;cursor:pointer}.ckl input{margin-right:8px}
@media print{header,.hw,footer,.tg{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;box-shadow:none}}
.ban{width:100%;height:auto;border-radius:16px;display:block;border:1px solid var(--bd)}.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:14px}.share a.tg{text-decoration:none;color:var(--tx)}
.tile{cursor:pointer;color:#fff;border:0;border-radius:14px;padding:16px;text-align:left;font:inherit;min-height:112px;transition:transform .15s,filter .15s}.tile:hover{filter:brightness(1.1);transform:translateY(-2px)}.tile b{display:block;font-size:17px;margin:4px 0}.tile small{opacity:.93}
</style>
</head>
