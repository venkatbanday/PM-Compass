<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PM Compass – Choose, Run and Report Projects Right</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--sf:#fff;--tx:#1b2430;--mu:#5a6676;--bd:#dde2e9;--ac:#1f5eff;--ac2:#e8eeff;--ok:#12805c;--wr:#b45309;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f141b;--sf:#18202a;--tx:#e8edf3;--mu:#9aa6b6;--bd:#2a3542;--ac:#6b95ff;--ac2:#1c2740;--ok:#3ccf9b;--wr:#f0a04b;--bad:#ff7b6e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f141b;--sf:#18202a;--tx:#e8edf3;--mu:#9aa6b6;--bd:#2a3542;--ac:#6b95ff;--ac2:#1c2740;--ok:#3ccf9b;--wr:#f0a04b;--bad:#ff7b6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--bd);z-index:9}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:1000px;margin:auto}
h1{font-size:18px;margin:0}h1 span{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:1000px;margin:auto}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tg{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer}
main{max-width:1000px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
h2{margin:6px 0 4px;font-size:22px}h3{margin:0 0 6px;font-size:16px}
.lead{color:var(--mu);margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin:0 4px 4px 0}
.warn{border-left:4px solid var(--wr)}.good{border-left:4px solid var(--ok)}.bad{border-left:4px solid var(--bad)}
ul{margin:4px 0 0;padding-left:20px}li{margin:2px 0}
a{color:var(--ac)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:9px 12px;border-radius:8px;margin:6px 0;cursor:pointer;font:inherit}
.opt.sel{border-color:var(--ac);background:var(--ac2)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}.row b{min-width:92px}
.gantt{position:relative;flex:1;height:22px;background:var(--bg);border-radius:6px;border:1px solid var(--bd)}
.gantt i{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--ac);opacity:.85}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--ac2)}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
.az{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.az div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}.az b{color:var(--ac)}
footer{max-width:1000px;margin:auto;padding:0 16px 30px}
input[type=range]{width:100%}
</style>
</head>
<body>
<header>
<div class="top"><h1>PM <span>Compass</span> · choose, run &amp; report projects right</h1><button class="tg" id="tg">Theme</button></div>
<nav id="nav"></nav>
</header>
<main id="m"></main>
<footer id="about"></footer>

<script>
const yt=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
const M={
waterfall:{n:"Waterfall (Predictive)",c:"Fixed scope, fixed cost, fixed date",
use:["Requirements are known and stable (construction, regulated, hardware, migrations)","Fixed-price contract or approved capex budget","Heavy compliance, sign-offs, audits","Vendors need a baseline to price against"],
avoid:["Users cannot say what they want yet","Market or tech changes monthly","Learning by building is the goal"],
phases:["Initiate","Requirements","Design","Build","Test","Deploy","Close"],
team:"Sponsor approves the baseline. PM owns plan, cost and change control. Analysts, designers, developers and testers work in sequence; each phase ends with a gate sign-off. After baseline, any change goes through a Change Control Board (CCB) with impact on cost, time and risk.",
reports:["Baseline plan (WBS, Gantt, budget)","Weekly status (RAG)","Earned Value report (PV, EV, AC, CPI, SPI)","Change log and CCB minutes","Phase-gate sign-off","Lessons learned"],
q:["waterfall project management explained","waterfall methodology phases"]},
pmp:{n:"PMP / PMBOK (Framework)",c:"A toolkit, not one method – predictive, agile or hybrid",
use:["You need a common language across industries","Large programmes with many stakeholders","You want 5 process groups and 10 knowledge areas as a checklist"],
avoid:["Treating it as bureaucracy for a small team"],
phases:["Initiating","Planning","Executing","Monitoring &amp; Controlling","Closing"],
team:"PM leads integration, scope, schedule, cost, quality, resources, communications, risk, procurement and stakeholders. Tailor the toolkit: predictive for fixed work, adaptive for uncertain work, hybrid for most real projects.",
reports:["Project charter","Project management plan","Risk &amp; issue registers","Stakeholder register and communication plan","Performance reports (EVM)","Lessons learned register"],
q:["PMP project management professional explained","PMBOK 7 principles performance domains"]},
prince2:{n:"PRINCE2 (Controlled stages)",c:"Governance-first, business-case driven (UK/EU public sector)",
use:["Public sector, government, large corporates","Strong governance: Board, stage gates, exceptions","Business case must stay valid at every stage"],
avoid:["Tiny teams that cannot staff the roles"],
phases:["Start-up","Initiation","Stage 1","Stage 2","Stage n","Final stage","Closing"],
team:"Project Board (Executive, Senior User, Senior Supplier) directs. PM manages day to day. Team Manager delivers work packages. Management by exception: the Board only intervenes when tolerances (time, cost, scope, risk, quality, benefit) are forecast to breach.",
reports:["Business Case","Project Initiation Documentation","Highlight Report (to Board, regular)","Checkpoint Report (team to PM)","Exception Report","End Stage and End Project Reports","Lessons Report"],
q:["PRINCE2 explained in simple terms","PRINCE2 7 principles themes processes"]},
agile:{n:"Agile / Scrum",c:"Time and cost fixed per sprint, scope flexes",
use:["Requirements will change as users see the product","Software, product, digital, R&amp;D","Fast feedback and frequent releases matter"],
avoid:["Fixed price, fixed scope, fixed date contracts","Teams with no empowered product owner","Using it as an excuse for no plan or no documentation"],
phases:["Vision","Backlog","Sprint 1","Sprint 2","Sprint 3","Release","Retro"],
team:"Product Owner orders the backlog. Scrum Master removes blockers. Developers (3–9, cross-functional) self-organise. Sprints of 1–4 weeks end with a working increment, a review with stakeholders and a retrospective.",
reports:["Product backlog","Sprint backlog and sprint goal","Burndown / burnup chart","Velocity trend","Cumulative flow","Release roadmap","Definition of Done"],
q:["scrum in under 10 minutes","agile vs waterfall explained"]},
kanban:{n:"Kanban / Lean",c:"Continuous flow, limit work in progress",
use:["Support, operations, maintenance, BAU","Work arrives unpredictably","You want to find bottlenecks fast"],
avoid:["Date-driven delivery projects with hard milestones"],
phases:["Visualise","Limit WIP","Manage flow","Policies","Feedback","Improve"],
team:"Board columns (To do, Doing, Review, Done) with WIP limits. Pull, do not push. Daily standup walks the board right to left. Track cycle time and throughput.",
reports:["Kanban board","Cycle time and lead time","Throughput","Cumulative flow diagram","Blocked-items report"],
q:["kanban explained","kanban vs scrum"]},
hybrid:{n:"Hybrid (Waterfall shell + Agile core)",c:"Fixed envelope, flexible inside",
use:["Fixed budget and date but uncertain details","Hardware plus software, or regulated plus digital","Client wants governance but team wants agility"],
avoid:["Mixing without clear rules for who may change what"],
phases:["Charter &amp; budget","Baseline milestones","Sprints","Integration test","Release gate","Close"],
team:"Governance, budget and milestones follow PRINCE2/PMP gates. Delivery inside each stage runs in sprints. Change within the agreed envelope goes to the Product Owner; change to cost or date goes to the Board.",
reports:["Milestone plan","Stage report plus sprint burndown","Budget vs forecast","Risk register","Change requests that break the envelope"],
q:["hybrid project management approach","waterfall agile hybrid explained"]}
};
const gantts={waterfall:[[0,10],[10,15],[25,15],[40,25],[65,15],[80,12],[92,8]],prince2:[[0,8],[8,12],[20,20],[40,20],[60,18],[78,12],[90,10]],pmp:[[0,10],[10,25],[35,40],[35,55],[90,10]],agile:[[0,8],[8,8],[16,20],[36,20],[56,20],[76,12],[88,12]],kanban:[[0,100],[0,100],[0,100],[0,100],[0,100],[0,100]],hybrid:[[0,10],[10,10],[20,45],[65,15],[80,10],[90,10]]};

const Q=[
["How stable are the requirements?",[["Fixed and signed off",{waterfall:3,prince2:1,pmp:1}],["Mostly known, some unknowns",{hybrid:3,pmp:1,prince2:1}],["Will change as we learn",{agile:3,kanban:1}]]],
["What does the contract or budget look like?",[["Fixed price, fixed scope, fixed date",{waterfall:4,prince2:1,pmp:1}],["Fixed budget and date, flexible scope",{hybrid:3,agile:1}],["Time and materials / funded per sprint",{agile:3,kanban:1}]]],
["How heavy is governance and compliance?",[["High: audits, board, stage gates",{prince2:3,waterfall:2,pmp:1}],["Medium: sponsor and steering group",{pmp:2,hybrid:2}],["Light: team decides",{agile:2,kanban:2}]]],
["What kind of work is it?",[["Construction, hardware, migration, regulated rollout",{waterfall:3,pmp:1}],["Software or product with users",{agile:3,hybrid:1}],["Support, operations, steady request flow",{kanban:4}]]],
["Can a Product Owner / user be available daily?",[["No, access is limited",{waterfall:2,prince2:1}],["Yes, regularly",{agile:3,hybrid:1}],["Not applicable",{kanban:1,pmp:1}]]],
["Team size and spread?",[["Under 10, co-located or well connected",{agile:2,kanban:1}],["10–50, several teams",{hybrid:2,pmp:1,prince2:1}],["50+, programme with vendors",{prince2:2,pmp:2,waterfall:1}]]]
];
const AZ=[["A","Accountability","Name one owner per task, risk and decision. Shared ownership means no ownership."],["B","Budget &amp; baseline","Cost baseline = approved budget. Track actuals, commitments and forecast to complete."],["C","Change control","Every change gets impact on scope, cost, time, risk and a decision by the right authority."],["D","Dependencies","Map internal and external dependencies. Most delays come from other teams."],["E","Escalation","Define when, to whom and how fast. Escalate with a recommendation, not just a problem."],["F","Forecasting","Report where you will land (EAC, ETC), not just where you are."],["G","Governance","Who decides what. Board, steering group, CCB, product owner."],["H","Handover","BAU readiness: runbooks, training, support model, sign-off before go-live."],["I","Issues vs risks","A risk may happen; an issue already has. Keep separate logs."],["J","Justification","Business case and benefits. Revisit at every gate."],["K","KPIs and SLAs","Choose few, measurable, owned. Review monthly."],["L","Lessons learned","Capture during, not after. Feed the next project."],["M","Meetings","Every meeting needs an agenda, owner, decisions and actions. Cancel the rest."],["N","Negotiation","Trade scope, time, cost, quality openly. Never absorb silently."],["O","Operating model","Process, people, tools, data, location. Ops managers own it daily."],["P","Procurement","Make or buy, tender, contract types (fixed, T&amp;M, cost-plus), vendor reviews."],["Q","Quality","Acceptance criteria, test plans, audits, defect trends."],["R","Resources","Capacity plan, skills matrix, leave, utilisation (aim 70–85%)."],["S","Stakeholders","Power/interest map. Tailor communication. Meet resistors early."],["T","Time &amp; schedule","Critical path, float, milestones, buffers."],["U","Utilisation &amp; capacity","Overloaded teams slow down. Limit work in progress."],["V","Value &amp; variance","Earned value: CPI, SPI. Investigate variance beyond tolerance."],["W","Work packages","Break to units of 8–80 hours with owner, estimate, done-criteria."],["X","eXit criteria","Define done before starting: gate, acceptance, closure."],["Y","Yield &amp; productivity","Output per person per cycle. Measure flow, not hours."],["Z","Zero-surprise reporting","Bad news early. Trust is your main asset with sponsors."]];

const RPT={Daily:["Standup / huddle notes (blockers, today’s plan)","Task board update","Issue and incident log","Cash, shift or capacity check (ops)"],Weekly:["Status report (RAG on scope, time, cost, risk, quality)","Risk and issue review","Resource and timesheet review","Change request log","Stakeholder update email"],Monthly:["Financial report: budget, actuals, forecast, variance","Earned value (CPI, SPI)","Steering committee pack","Benefits and KPI dashboard","Invoice and milestone billing reconciliation","Vendor performance review"],"Stage / Quarterly":["Gate review and sign-off","Business case health check","Audit and compliance report","Lessons learned","Programme dashboard to executives"]};

const AI=[["Meeting notes, actions, minutes","Transcription and summary assistants (Teams, Zoom, Otter, Claude)","Saves 3–6 hrs per PM per week"],["Status reports and dashboards","Pull data from Jira, Excel, Sheets, Power BI; AI drafts the narrative","Saves 2–4 hrs per week"],["Risk logging and early warning","AI scans emails, tickets and plans for risk language and slippage patterns","Earlier detection, fewer surprises"],["Scheduling and resource planning","Auto-levelling in MS Project, Smartsheet, Asana, Monday","Reduces planner effort 30–50%"],["Invoicing, timesheets, reconciliation","Finance automation: Xero, QuickBooks, Power Automate, Zapier","Removes manual chasing and errors"],["Documents: charters, RFPs, test cases, SOPs","Generative AI drafts; humans review","60–70% faster first drafts"],["Ticket triage and first-line support","Chatbots and auto-routing (Zendesk, ServiceNow)","Frees L1 capacity"],["Repetitive ops workflows (RPA)","UiPath, Power Automate for data entry, approvals, checks","Replace routine, not judgement"]];
const LEARN=[["Foundations","Start here: what is a project, programme, portfolio","project management basics for beginners"],["Waterfall","Fixed scope, fixed cost, phase gates","waterfall methodology project example"],["Agile vs Waterfall","Why teams break by choosing the wrong one","agile vs waterfall when to use which"],["Scrum","Roles, events, artefacts, daily scrum","scrum guide explained sprint planning daily scrum review retrospective"],["PRINCE2","Stages, board, exception reports","PRINCE2 full course"],["PMP / PMBOK","Process groups, knowledge areas","PMP exam prep PMBOK"],["Earned Value","CPI, SPI, EAC step by step","earned value management explained"],["Risk management","Register, probability x impact, response","project risk management process register"],["Budgeting and billing","Cost baseline, milestone vs T&amp;M billing","project budgeting and cost control"],["Stakeholder management","Power interest grid, comms plan","stakeholder management project"],["Operations management","Process, capacity, SLAs, lean","operations management fundamentals"],["AI for project managers","Automate reports, notes, planning","AI tools for project managers"]];

const S={ans:[],tab:"choose"};
const TABS=[["choose","Choose method"],["methods","Methodologies"],["chart","Project chart"],["agile","Scrum daily"],["reports","Reports"],["risk","Risk"],["money","Budget &amp; billing"],["stake","Stakeholders"],["az","A to Z"],["ai","AI &amp; manpower"],["learn","Learn / videos"]];
const $=s=>document.querySelector(s);
const tag=a=>a.map(x=>`<span class="tag">${x}</span>`).join("");
const ul=a=>"<ul>"+a.map(x=>`<li>${x}</li>`).join("")+"</ul>";
const V=(k)=>M[k].q.map(q=>`<a href="${yt(q)}" target="_blank" rel="noopener">▶ ${q}</a>`).join("<br>");

function hdr(t,l){return `<h2>${t}</h2><p class="lead">${l}</p>`}
const R={
choose(){
let h=hdr("Which methodology should I use?","Answer six questions. The rule most people miss: <b>finalised plan, fixed cost, no further changes = Waterfall</b>. Using Agile there causes budget overruns and broken trust.");
Q.forEach((q,i)=>{h+=`<div class="card"><h3>${i+1}. ${q[0]}</h3>`+q[1].map((o,j)=>`<button class="opt ${S.ans[i]===j?"sel":""}" onclick="pick(${i},${j})">${o[0]}</button>`).join("")+"</div>"});
const sc={};S.ans.forEach((j,i)=>{if(j!=null)for(const k in Q[i][1][j][1])sc[k]=(sc[k]||0)+Q[i][1][j][1][k]});
const ks=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]);
if(S.ans.filter(x=>x!=null).length>=4&&ks.length){const mx=sc[ks[0]];const m=M[ks[0]];
h+=`<div class="card good"><h3>Best fit: ${m.n}</h3><p>${m.c}</p>${ul(m.use)}<p><b>Watch out:</b></p>${ul(m.avoid)}<p><b>Also consider:</b></p>`+ks.slice(0,4).map(k=>`<div class="row"><b>${M[k].n.split(" (")[0]}</b><div class="bar" style="flex:1"><i style="width:${Math.round(sc[k]/mx*100)}%"></i></div></div>`).join("")+`<p>${V(ks[0])}</p></div>`}
else h+=`<p class="lead">Answer at least four questions to see your result.</p>`;
h+=`<div class="card warn"><h3>Golden rules</h3>${ul(["Fixed cost + fixed scope + fixed date → Waterfall or PRINCE2 with strict change control.","Unknown scope, learning needed → Agile; fund by sprint or by capacity, not by fixed scope.","Fixed budget but uncertain detail → Hybrid.","Never promise a fixed price on an Agile backlog without a clear scope-swap rule.","Steady flow of requests → Kanban."])}</div>`;return h},
methods(){let h=hdr("How each methodology works","Roles, flow, reports and when to use or avoid.");
h+=`<div class="tw card"><table><tr><th>Method</th><th>Scope</th><th>Cost</th><th>Change</th><th>Best for</th></tr><tr><td>Waterfall</td><td>Fixed</td><td>Fixed</td><td>Formal CCB only</td><td>Known requirements</td></tr><tr><td>PRINCE2</td><td>Staged, tolerance</td><td>Per stage</td><td>Exception based</td><td>Governance heavy</td></tr><tr><td>PMP/PMBOK</td><td>Tailored</td><td>Baselined</td><td>Integrated change control</td><td>Any, via tailoring</td></tr><tr><td>Agile/Scrum</td><td>Flexes</td><td>Fixed per sprint</td><td>Welcome, via backlog</td><td>Uncertain products</td></tr><tr><td>Kanban</td><td>Continuous</td><td>Capacity</td><td>Anytime within WIP</td><td>Operations</td></tr><tr><td>Hybrid</td><td>Fixed envelope</td><td>Fixed</td><td>Inside: PO. Outside: Board</td><td>Mixed projects</td></tr></table></div><div class="grid">`;
for(const k in M){const m=M[k];h+=`<div class="card"><h3>${m.n}</h3><p class="lead">${m.c}</p><p>${m.team}</p><b>Use when</b>${ul(m.use)}<b>Avoid when</b>${ul(m.avoid)}<p><b>Reports</b></p>${tag(m.reports)}<p>${V(k)}</p></div>`}
return h+"</div>"},
chart(){let h=hdr("Project chart: how it starts, runs and ends","Pick a method to see the stage-by-stage flow on a timeline.");
h+=`<select id="cs">${Object.keys(M).map(k=>`<option value="${k}" ${S.cs===k?"selected":""}>${M[k].n}</option>`).join("")}</select>`;
const k=S.cs||"waterfall";S.cs=k;const g=gantts[k];
h+=`<div class="card" style="margin-top:12px">`+M[k].phases.map((p,i)=>{const b=g[i]||[0,100];return `<div class="row"><b>${p}</b><div class="gantt"><i style="left:${b[0]}%;width:${b[1]}%"></i></div></div>`}).join("")+`</div>`;
const st={waterfall:["Charter and business case approved","Baseline WBS, Gantt, budget; sign-off","Each phase ends with a gate; no work starts before sign-off","Changes only via CCB; re-baseline if approved","Close with acceptance, handover, lessons"],prince2:["Board appoints Executive and PM","Business Case and PID approved","Board authorises each stage","Highlight and checkpoint reports; exceptions escalate","Final stage and benefits review plan"],pmp:["Charter signed","Plan across 10 knowledge areas","Execute and manage work","Monitor, control, integrated change","Close and release resources"],agile:["Vision and roadmap","Backlog refined and ordered","Sprint planning, daily scrum","Sprint review with stakeholders and retrospective","Release when value is enough"],kanban:["Map workflow","Set WIP limits","Pull work daily","Review flow metrics","Improve policies"],hybrid:["Charter and budget envelope","Milestones baselined","Sprints within each milestone","Gate reviews against envelope","Release and close"]}[k];
return h+`<div class="card"><h3>Stage by stage</h3>${ul(st)}<p>${V(k)}</p></div>`},
agile(){return hdr("Agile and Scrum: daily meetings and rhythm","Events that keep a Scrum team coordinated.")+`<div class="grid"><div class="card"><h3>Daily Scrum (15 min, same time)</h3>${ul(["Held by developers, for developers","Inspect progress toward the sprint goal","Three prompts: what moved us forward, what will move us today, what blocks us","Take detailed talks offline","Update the board after, not during"])}</div><div class="card"><h3>Sprint cadence</h3>${ul(["Planning (≤8 hrs for 4-week sprint): why, what, how","Daily Scrum","Refinement: ~10% of capacity","Review: demo to stakeholders, adapt backlog","Retrospective: improve team process"])}</div><div class="card"><h3>Roles</h3>${ul(["Product Owner: value and priority","Scrum Master: coaching and blockers","Developers: build a Done increment"])}</div><div class="card"><h3>Common mistakes</h3>${ul(["Standup turns into status report to manager","No sprint goal","Changing sprint scope mid-sprint","Treating velocity as target","Agile on a fixed-price, fixed-scope contract"])}</div></div><div class="card"><p>${V("agile")}</p></div>`},
reports(){let h=hdr("Reports and coordination","What to produce daily, weekly, monthly and per stage.")+`<div class="grid">`;for(const k in RPT)h+=`<div class="card"><h3>${k}</h3>${ul(RPT[k])}</div>`;
return h+`</div><div class="card"><h3>RAG status rule</h3><p><b style="color:var(--ok)">Green</b> within tolerance · <b style="color:var(--wr)">Amber</b> forecast to breach, recovery plan in place · <b style="color:var(--bad)">Red</b> breached or needs sponsor decision today.</p></div>`},
risk(){return hdr("Risk management","Identify early, score, respond, monitor.")+`<div class="grid"><div class="card"><h3>Process</h3>${ul(["1. Identify: workshops, checklists, lessons","2. Analyse: probability × impact (1–5 each)","3. Plan response: avoid, mitigate, transfer, accept, exploit","4. Assign owner and trigger","5. Review weekly; escalate score ≥15","6. Close and learn"])}</div><div class="card"><h3>Risk register fields</h3>${tag(["ID","Description (cause, event, effect)","Probability","Impact","Score","Owner","Response","Trigger","Status","Contingency cost"])}</div></div><div class="card"><h3>Risk scorer</h3>Probability <span id="pv">3</span><input type="range" min="1" max="5" value="3" id="pr" oninput="rk()">Impact <span id="iv">3</span><input type="range" min="1" max="5" value="3" id="im" oninput="rk()"><p id="rs"></p></div>`},
money(){return hdr("Budgeting and billing","Control cost and get paid on time.")+`<div class="grid"><div class="card"><h3>Budget build</h3>${ul(["Bottom-up from WBS, add contingency (5–15%) and management reserve","Approve cost baseline, then track actuals, commitments, forecast","Monthly: budget vs actual vs EAC","Capex and opex split where needed"])}</div><div class="card"><h3>Billing models</h3>${ul(["Fixed price: milestone billing, strict change control","Time and materials: timesheets, rate card, cap","Cost-plus: audited costs plus fee","Retainer / capacity: monthly per team","Outcome based: tied to KPIs"])}</div><div class="card"><h3>Earned value calculator</h3>BAC <input id="bac" type="number" value="100000" oninput="ev()"> % planned <input id="pp" type="number" value="50" oninput="ev()"> % done <input id="pd" type="number" value="40" oninput="ev()"> Actual cost <input id="ac" type="number" value="55000" oninput="ev()"><p id="evo"></p></div></div><div class="card"><p>${V("waterfall")}</p></div>`},
stake(){return hdr("Stakeholder coordination","Right message, right person, right rhythm.")+`<div class="tw card"><table><tr><th>Stakeholder</th><th>Needs</th><th>Channel and rhythm</th></tr><tr><td>Sponsor / Board</td><td>Value, cost, key decisions</td><td>Highlight report, monthly steering</td></tr><tr><td>Client / Product Owner</td><td>Scope, priority, demos</td><td>Weekly review, sprint review</td></tr><tr><td>Team</td><td>Clarity, unblocked work</td><td>Daily standup, retro</td></tr><tr><td>Finance</td><td>Forecast, invoices</td><td>Monthly pack</td></tr><tr><td>Vendors</td><td>Scope, payment, access</td><td>Weekly call, SLA review</td></tr><tr><td>Operations / Support</td><td>Readiness, training</td><td>Handover plan, go-live checklist</td></tr><tr><td>Legal / Compliance</td><td>Evidence, approvals</td><td>Gate reviews</td></tr><tr><td>End users</td><td>Usability, training</td><td>UAT, feedback sessions</td></tr></table></div><div class="card"><h3>Power / interest</h3>${ul(["High power, high interest: manage closely","High power, low interest: keep satisfied","Low power, high interest: keep informed","Low, low: monitor"])}</div>`},
az(){let h=hdr("A to Z for project and operations managers","A refresher even for 30-year veterans. Search to filter.")+`<input id="aq" placeholder="Filter…" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);margin-bottom:10px" oninput="azf()"><div class="az" id="azl"></div>`;setTimeout(azf,0);return h},
ai(){let h=hdr("AI, automation and saving manpower","Use AI to remove routine work, then move people up the value chain. Review everything AI produces.")+`<div class="tw card"><table><tr><th>Task</th><th>Tools / approach</th><th>Typical effect</th></tr>`+AI.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td></tr>`).join("")+`</table></div><div class="grid"><div class="card"><h3>Learn → work path</h3>${ul(["Week 1: use AI for notes and email drafts","Week 2–3: automate one weekly report","Month 2: connect tools with Power Automate or Zapier","Month 3: pilot AI risk scan on one project","Month 4: measure hours saved; scale"])}</div><div class="card"><h3>Guardrails</h3>${ul(["No confidential data in unapproved tools","Human approves anything sent to clients","Track hours saved, errors, adoption","Redeploy people to stakeholder and judgement work","Estimates in this table are indicative, test locally"])}</div></div><div class="card"><a href="${yt("AI tools for project managers")}" target="_blank" rel="noopener">▶ AI tools for project managers</a></div>`;return h},
learn(){return hdr("Learn: curated video searches","Each link opens a live YouTube search so you always get current, relevant lessons.")+`<div class="grid">`+LEARN.map(l=>`<div class="card"><h3>${l[0]}</h3><p class="lead">${l[1]}</p><a href="${yt(l[2])}" target="_blank" rel="noopener">▶ Watch videos</a></div>`).join("")+`</div>`}
};
function pick(i,j){S.ans[i]=j;go("choose")}
function rk(){const p=+$("#pr").value,i=+$("#im").value;$("#pv").textContent=p;$("#iv").textContent=i;const s=p*i;$("#rs").innerHTML=`Score <b>${s}</b>: `+(s>=15?"<b style='color:var(--bad)'>High – escalate, act now</b>":s>=8?"<b style='color:var(--wr)'>Medium – mitigate, review weekly</b>":"<b style='color:var(--ok)'>Low – monitor</b>")}
function ev(){const b=+$("#bac").value,pp=b*$("#pp").value/100,e=b*$("#pd").value/100,a=+$("#ac").value;const cpi=e/a,spi=e/pp,eac=b/cpi;$("#evo").innerHTML=`CPI ${cpi.toFixed(2)} · SPI ${spi.toFixed(2)} · EAC ${Math.round(eac).toLocaleString()}<br>${cpi<1?"Over budget":"Within budget"}, ${spi<1?"behind schedule":"on or ahead of schedule"}.`}
function azf(){const q=($("#aq")?.value||"").toLowerCase();$("#azl").innerHTML=AZ.filter(a=>(a[1]+a[2]).toLowerCase().includes(q)).map(a=>`<div><b>${a[0]}</b> · ${a[1]}<br><small>${a[2]}</small></div>`).join("")}
function go(t){S.tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}
$("#nav").innerHTML=TABS.map(x=>`<button class="${x[0]===t?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");
$("#m").innerHTML="<section class='on'>"+R[t]()+"</section>";
const cs=$("#cs");if(cs)cs.onchange=e=>{S.cs=e.target.value;go("chart")};
if(t==="risk")rk();if(t==="money")ev();scrollTo(0,0)}
$("#tg").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme==="dark";d.dataset.theme=dark?"light":"dark"};
$("#about").innerHTML=`<div class="card"><h3>About the builder</h3><p>VB (Venkateswararao Banday) is a multi-sector programme and operations leader with the right to work in the UK and India, looking for roles in London.</p><p>I build apps with AI and share them free to spread knowledge and useful information. If this helped you, and you know of any opportunity or can refer me, I would be very grateful.</p><p><a href="https://wa.me/919962507575" target="_blank" rel="noopener">WhatsApp +91 9962507575</a> · <a href="https://wa.me/447391522993" target="_blank" rel="noopener">WhatsApp +44 7391 522993</a> · <a href="https://www.linkedin.com/in/venkateswararao-banday" target="_blank" rel="noopener">LinkedIn</a></p><p><small>Prefer not to click links? WhatsApp +91 9962507575 · WhatsApp +44 7391 522993 · LinkedIn: linkedin.com/in/venkateswararao-banday</small></p><p><small>Educational guidance, not professional certification advice. Tailor to your organisation and contract.</small></p></div>`;
const h0=(location.hash||"").slice(1);go(R[h0]?h0:"choose");
</script>
